# Alerting rules for the King Teen Patti game server.
#
# Every rule has a `for:` long enough to ride out a single bad scrape and a
# `runbook` annotation pointing at the section of MONITORING.md that explains
# what to do. Severities: "critical" = players are affected right now,
# "warning" = they will be soon if nothing changes.
#
# Tunables live in the recording rules at the top so a limit is changed in one
# place; the alerts read them with scalar().

groups:
  # ------------------------------------------------------------- tunables
  - name: king-teenpatti-limits
    interval: 1m
    rules:
      # The most simultaneous Socket.IO connections this deployment can carry.
      # Set it to the SMALLEST of:
      #   • nginx: worker_processes × worker_connections ÷ 2
      #     (a proxied websocket holds one client-side and one upstream
      #     connection; with the shipped 4 × 16384 that is 32,768)
      #   • Node: LimitNOFILE of the service minus ~200 for files, DB pool, logs
      #   • the capacity the load test actually proved.
      # Ubuntu's default 768 × 4 ÷ 2 = 1,536 is exactly where the 2026-09-08
      # load tests fell over with HTTP 500s on every new handshake.
      - record: king_teenpatti:socket_limit
        expr: vector(12000)

      # Physical RAM of the box the game server runs on, for the RSS alert.
      # Taken from node_exporter when it is scraped (job "node"); otherwise the
      # fixed fallback — the production host has 8 GiB. Change the constant if
      # the machine changes and node_exporter is not running.
      - record: king_teenpatti:host_memory_bytes
        expr: max(node_memory_MemTotal_bytes{job="node"}) or vector(8589934592)

  # ---------------------------------------------------------- game server
  - name: king-teenpatti-game-server
    rules:
      - alert: GameServerDown
        expr: up{job="game-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Game server metrics endpoint is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 1 minute. Either the game server process is down (systemctl status gameplay) or /metrics is refusing us (token / IP allow-list)."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerSchedulerLatencyHigh
        # p99 of the time runnable goroutines wait for a CPU (the Go server's
        # equivalent of Node's event-loop lag): every ack, broadcast and turn
        # timer queues behind it. The runtime histogram has coarse buckets
        # (~1 ms, ~10 ms, ~117 ms), so 100 ms means the tail really is in the
        # top bucket, i.e. the CPUs are saturated or something is holding them.
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(game_server_go_sched_latencies_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Go scheduler latency p99 above 100 ms for 5 minutes"
          description: "p99 scheduler latency is {{ $value | humanizeDuration }}. Check process CPU against GOMAXPROCS (game_server_process_cpu_seconds_total vs game_server_go_sched_gomaxprocs_threads), GC pause time (game_server_go_gc_duration_seconds) and the move/state-update histograms."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerGoroutinesHigh
        # At rest the server runs a handful of goroutines per socket plus one
        # per table; 50,000 with a normal player count means goroutines are
        # leaking (a listener that never returns, a timer never stopped).
        expr: game_server_go_goroutines > 50000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 50,000 goroutines for 5 minutes"
          description: "{{ $value | humanize }} goroutines on {{ $labels.instance }} (game_server_go_goroutines). Compare with game_connected_sockets and game_tables; if those are flat this is a leak — take a goroutine profile before restarting."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerSocketsNearLimit
        expr: game_connected_sockets > 0.85 * scalar(king_teenpatti:socket_limit)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Connected sockets within 15% of the configured limit"
          description: "{{ $value }} sockets open on {{ $labels.instance }}; the limit recorded in king_teenpatti:socket_limit is {{ with query \"king_teenpatti:socket_limit\" }}{{ . | first | value }}{{ end }}. Past it nginx answers new handshakes with HTTP 500 (worker_connections) or Node hits EMFILE."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerSocketsAtLimit
        expr: game_connected_sockets > 0.97 * scalar(king_teenpatti:socket_limit)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Connected sockets at the configured limit"
          description: "{{ $value }} sockets open on {{ $labels.instance }}. New players are probably failing to connect right now."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerHttp5xxRate
        # Share of responses that were 5xx, only counted when there is real
        # traffic (> 1 req/s) so a single failed request on a quiet night does
        # not page anybody.
        expr: |
          (
            sum(rate(game_http_requests_total{status_code=~"5.."}[5m]))
              /
            sum(rate(game_http_requests_total[5m]))
          ) > 0.05
          and
          sum(rate(game_http_requests_total[5m])) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of HTTP responses are 5xx"
          description: "{{ $value | humanizePercentage }} of REST responses in the last 5 minutes were server errors. Break down by route with sum by (route) (rate(game_http_requests_total{status_code=~\"5..\"}[5m]))."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerMoveLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(game_move_processing_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Move processing p99 above 500 ms"
          description: "p99 move latency is {{ $value | humanizeDuration }}. A move is one ledger transaction: look at game_db_transaction_duration_seconds by op and at the pool (game_db_pool_waiting_requests)."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerDbTransactionErrors
        expr: sum by (op, code) (rate(game_db_transaction_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ledger transactions are rolling back ({{ $labels.op }}/{{ $labels.code }})"
          description: "{{ $value | humanize }} {{ $labels.op }} transactions per second have failed with {{ $labels.code }} for 5 minutes. duplicate_action is a client retry (benign); anything else means chips are not moving."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerDbPoolSaturated
        expr: game_db_pool_waiting_requests > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queries are waiting for a pg pool connection"
          description: "{{ $value }} queries have been queued for a pool connection for 2 minutes. Raise PG_POOL_MAX or find the slow transaction (pg_stat_activity_max_tx_duration)."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerMemoryHigh
        # Go has no heap limit unless GOMEMLIMIT is set, so the process grows
        # until the OOM killer takes it: alert on RSS against the box's RAM
        # (king_teenpatti:host_memory_bytes — node_exporter, or the 8 GiB
        # fallback in the limits group).
        expr: |
          game_server_process_resident_memory_bytes > 0.8 * scalar(king_teenpatti:host_memory_bytes)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Game server RSS above 80% of host memory"
          description: "The game server's resident memory is {{ $value | humanize1024 }}B on {{ $labels.instance }}, above 80% of the host's RAM for 10 minutes. The OOM killer is next. Look at heap live bytes vs players (a leak in per-table or per-socket state); GOMEMLIMIT in the unit's Environment= makes the GC work harder before that point."
          runbook: "MONITORING.md#alerts"

  # ----------------------------------------------------------- postgresql
  - name: king-teenpatti-postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "postgres_exporter cannot reach PostgreSQL"
          description: "pg_up has been 0 for a minute. Either PostgreSQL is down or the exporter's DATA_SOURCE_NAME / pg_hba.conf is wrong. Every move on every table fails while this is true."
          runbook: "MONITORING.md#alerts"

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="gameplay"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks detected in the gameplay database"
          description: "{{ $value | humanize }} deadlocks in the last 5 minutes. The ledger locks wallets in ascending user id order to prevent exactly this; a deadlock means something new is taking locks out of order."
          runbook: "MONITORING.md#alerts"

      - alert: PostgresCacheHitRatioLow
        # Only meaningful when the database is actually reading blocks.
        expr: |
          (
            sum(rate(pg_stat_database_blks_hit{datname="gameplay"}[15m]))
              /
            (sum(rate(pg_stat_database_blks_hit{datname="gameplay"}[15m])) + sum(rate(pg_stat_database_blks_read{datname="gameplay"}[15m])))
          ) < 0.9
          and
          sum(rate(pg_stat_database_blks_read{datname="gameplay"}[15m])) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL buffer cache hit ratio below 90%"
          description: "Cache hit ratio is {{ $value | humanizePercentage }}. shared_buffers is too small for the working set, or a query is scanning chip_ledger/hands without an index."
          runbook: "MONITORING.md#alerts"

      - alert: PostgresConnectionsNearMax
        expr: |
          sum(pg_stat_activity_count) / scalar(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of max_connections are in use. The game server holds at most PG_POOL_MAX (50 in production); the rest is somebody else."
          runbook: "MONITORING.md#alerts"

      - alert: PostgresLongTransaction
        expr: max(pg_stat_activity_max_tx_duration{datname="gameplay"}) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A transaction has been open for more than a minute"
          description: "Longest open transaction in gameplay is {{ $value | humanizeDuration }}. A ledger transaction should take milliseconds; this one is holding a wallet row lock."
          runbook: "MONITORING.md#alerts"

  # ---------------------------------------------------------------- nginx
  - name: king-teenpatti-nginx
    rules:
      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nginx stub_status is unreachable"
          description: "nginx-prometheus-exporter cannot read stub_status. Either nginx is down or the :8080 status server / allow-list is wrong."
          runbook: "MONITORING.md#alerts"

      - alert: NginxDroppingConnections
        # accepted − handled is the number of connections nginx could not
        # serve — the "worker_connections are not enough" failure that showed
        # as HTTP 500 on every Socket.IO handshake in the 2026-09-08 load test.
        expr: |
          rate(nginx_connections_accepted[5m]) - rate(nginx_connections_handled[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "nginx is accepting connections it cannot handle"
          description: "{{ $value | humanize }} connections/s accepted but not handled. Check /var/log/nginx/error.log for 'worker_connections are not enough' and raise worker_connections / worker_rlimit_nofile (see nginx/nginx.conf.example)."
          runbook: "MONITORING.md#alerts"

      - alert: NginxConnectionsNearWorkerLimit
        # Active connections against the capacity in nginx.conf.example
        # (4 workers × 16384). Change the constant with the config.
        expr: nginx_connections_active > 0.8 * (4 * 16384)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nginx active connections above 80% of worker capacity"
          description: "{{ $value }} active connections. Each proxied websocket costs two; raise worker_connections before the NginxDroppingConnections alert fires."
          runbook: "MONITORING.md#alerts"

      # nginx-side 5xx rate. stub_status has no status-code counters, so this
      # rule uses the application's own counter: an nginx-generated 500/502/504
      # (upstream down, worker_connections exhausted) is NOT in it. For the real
      # thing install the VTS module or an access-log exporter (MONITORING.md
      # "Nginx") and switch the expression to, e.g.
      #   sum(rate(nginx_vts_server_requests_total{code="5xx"}[5m]))
      #     / sum(rate(nginx_vts_server_requests_total[5m])) > 0.05
      - alert: Nginx5xxRate
        expr: |
          (
            sum(rate(game_http_requests_total{status_code=~"5.."}[5m]))
              /
            sum(rate(game_http_requests_total[5m]))
          ) > 0.05
          and
          sum(rate(game_http_requests_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx responses above 5% behind nginx"
          description: "{{ $value | humanizePercentage }} of proxied responses were 5xx (application-side counter; see rule comment for nginx-generated errors)."
          runbook: "MONITORING.md#alerts"

  # ----------------------------------------------------------------- host
  - name: king-teenpatti-host
    rules:
      - alert: HostHighCpu
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 90% for 10 minutes"
          description: "CPU on {{ $labels.instance }} is {{ $value | humanizePercentage }}. The Go server uses every core: if rate(game_server_process_cpu_seconds_total) is near the core count the game server itself is the bottleneck, otherwise look at PostgreSQL."
          runbook: "MONITORING.md#alerts"

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of RAM available"
          description: "{{ $value | humanizePercentage }} of memory is available on {{ $labels.instance }}. The OOM killer picks the biggest process, which is PostgreSQL or the game server."
          runbook: "MONITORING.md#alerts"

      - alert: HostDiskAlmostFull
        expr: |
          1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem above 85%"
          description: "{{ $value | humanizePercentage }} of / is used on {{ $labels.instance }}. PostgreSQL stops accepting writes when the disk fills; chip_ledger grows with every move."
          runbook: "MONITORING.md#alerts"

      - alert: HostFileDescriptorsHigh
        expr: node_filefd_allocated{job="node"} / node_filefd_maximum{job="node"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System-wide file descriptors above 80% of fs.file-max"
          description: "{{ $value | humanizePercentage }} of the kernel's file-descriptor table is in use on {{ $labels.instance }}. Each websocket is a descriptor in nginx and another in the game server."
          runbook: "MONITORING.md#alerts"

      - alert: GameServerFileDescriptorsHigh
        expr: game_server_process_open_fds / game_server_process_max_fds > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Game server process above 80% of its open-files limit"
          description: "{{ $value | humanizePercentage }} of the process's fd limit is used. Raise LimitNOFILE in gameplay.service (go-server/ops/gameplay-go.service sets 65536) before accept() starts failing with EMFILE."
          runbook: "MONITORING.md#alerts"

  - name: king-teenpatti-live-state
    rules:
      # Redis holds the live table state: snapshots, presence, turn deadlines
      # and the matchmaking index. Losing it does NOT lose money — every chip
      # is in PostgreSQL — but a restart would then drop the tables in play.
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis (live state) is unreachable"
          description: "redis_up is 0 on {{ $labels.instance }}. Games keep running from the server's own memory and no chips are at risk, but table snapshots are no longer saved, so a restart would drop every hand in progress. Check: systemctl status redis-server; redis-cli ping."
          runbook: "MONITORING.md#alerts"

      - alert: LiveStoreErrors
        # The server never refuses a move because of the live store, so these
        # are silent until they are counted here.
        expr: sum(rate(game_live_store_errors_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live-state writes are failing"
          description: "{{ $value | humanize }} failed live-store calls per second (game_live_store_errors_total by op). The game is unaffected in the moment; a restart would lose the tables whose snapshots did not land. Check Redis memory (noeviction means writes fail when full) and the server log."
          runbook: "MONITORING.md#alerts"

      - alert: LiveStoreSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(game_live_store_duration_seconds_bucket[5m]))) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Live-state calls are taking over 50 ms at p95"
          description: "p95 {{ $value | humanizeDuration }} on the live store. On a loopback Redis this should be well under a millisecond; check Redis CPU, a slow BGSAVE, or swap on the host."
          runbook: "MONITORING.md#alerts"

      - alert: RedisMemoryNearCap
        # noeviction: at the cap, writes fail rather than data being dropped.
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis is over 80% of its memory cap"
          description: "{{ $value | humanizePercentage }} of maxmemory used. The policy is noeviction, so at 100% live-state writes start failing. Raise maxmemory in /etc/redis/redis.conf.d/king-teenpatti.conf or check for keys that are not expiring (redis-cli --scan --pattern 'kt:*' | wc -l)."
          runbook: "MONITORING.md#alerts"

      - alert: PotsRefundedOnStart
        # The startup safety net: an open pot whose table did not come back is
        # returned to its contributors through the ledger. A few after a crash
        # are expected; a stream of them is not.
        expr: increase(game_refunded_pots_total[15m]) > 20
        labels:
          severity: warning
        annotations:
          summary: "More than 20 pots refunded in the last 15 minutes"
          description: "{{ $value | humanize }} open pots had no live table on startup and were refunded (game_refunded_pots_total). Expected after a crash without Redis; if it repeats, table snapshots are not being saved — check RedisDown and LiveStoreErrors."
          runbook: "MONITORING.md#alerts"
