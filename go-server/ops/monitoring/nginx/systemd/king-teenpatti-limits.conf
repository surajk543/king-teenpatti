# /etc/systemd/system/king-teenpatti.service.d/limits.conf
#
# The Node game server holds one descriptor per websocket plus the pg pool,
# log files and the listening socket. With the 1024 default it dies of EMFILE
# ("too many open files") near 1,000 players — the same order of magnitude as
# the nginx ceiling this directory fixes. Match nginx's limit.
#
# Rename the directory if the Node unit is not called king-teenpatti.service
# (see king-teenpatti.service.example for a reference unit).
#
#   sudo mkdir -p /etc/systemd/system/king-teenpatti.service.d
#   sudo cp king-teenpatti-limits.conf /etc/systemd/system/king-teenpatti.service.d/limits.conf
#   sudo systemctl daemon-reload && sudo systemctl restart king-teenpatti
#   curl -s localhost:3000/metrics | grep game_server_process_max_fds          # expect 65536
[Service]
LimitNOFILE=65536
