# /etc/nginx/sites-available/gameplay — ROLLBACK variant: api.sungamestudio.com
# in front of the SINGLE-PROCESS server (gameplay.service on 127.0.0.1:3000).
#
# Same Certbot lines, /dashboard/ and "/metrics → 404" as nginx-gameplay.conf,
# but every game location goes to :3000 — including the per-worker paths
# /w1/socket.io/ … /w3/socket.io/. Keeping those is what makes rollback safe:
# a client that saved a worker path (SharedPreferences `socketPath`,
# localStorage `tp_path`) would otherwise get 404s until it fell back to the
# default path. The single process answers session:ready with
# worker.path "/socket.io", so clients unlearn the worker path on first contact.
#
# Use: ROLLBACK.md step 3 (or restore the .bak the installer wrote, which is
# the pre-cluster site without these extra paths).

# ------------------------------------------------------------------ upstream
upstream game_workers {
    # The one Node process (PORT=3000 in server/.env).
    server 127.0.0.1:3000;
    # Reused for REST calls; websockets are never pooled (each one holds its
    # upstream connection for its whole life).
    keepalive 64;
}

# "Connection: upgrade" when the client asked for a websocket, an empty header
# (so upstream keepalive works) otherwise. Named to avoid clashing with a
# $connection_upgrade map another site on this box may already define.
map $http_upgrade $gameplay_connection_upgrade {
    default upgrade;
    ''      '';
}

# -------------------------------------------------------------------- https
server {
    server_name api.sungamestudio.com;

    # The API accepts JSON bodies of at most 32 kB; handshakes are small too.
    client_max_body_size 64k;
    proxy_http_version 1.1;

    # Prometheus scrapes 127.0.0.1:3000/metrics directly; never public.
    location = /metrics {
        return 404;
    }

    # ----- Grafana (docker, published on 127.0.0.1:3001)
    location /dashboard/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ----- Socket.IO, default path
    location /socket.io/ {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        # An idle seated socket only carries a Socket.IO ping every 25 s; an
        # hour means nginx never closes a healthy game socket on its own.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ----- former per-worker paths, all to the single process (see header)
    # --- per-worker paths BEGIN
    location /w1/socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location /w2/socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location /w3/socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    # --- per-worker paths END

    # ----- health
    location = /health {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        access_log off;
    }

    # ----- REST API and the reference browser client
    location / {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.sungamestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sungamestudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --------------------------------------------------------------- http → https
server {
    if ($host = api.sungamestudio.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name api.sungamestudio.com;
    return 404;
}
