# /etc/nginx/sites-available/gameplay — api.sungamestudio.com in front of the
# King Teen Patti game WORKERS (gameplay@1..3, ports 3101..3103).
#
# Replaces the single-process site that sent "location /" to 127.0.0.1:3000.
# Everything Certbot manages is kept verbatim (server_name, the ssl_* lines,
# the port-80 redirect server); /dashboard/ (Grafana on :3001) and the
# "/metrics → 404" rule are unchanged. install-cluster.sh installs this file
# and reloads nginx; ROLLBACK.md puts the old site back.
#
# How routing works (server/src/cluster/registry.js is the other half):
#   • A NEW player connects on the default path /socket.io/ and lands on any
#     worker — least_conn picks the one with the fewest open connections.
#     Quick-join is worker-local, so tables fill within a worker.
#   • A RETURNING player (held seat, resume offer, or a private table code)
#     may land on the wrong worker. That worker looks the player/table up in
#     PostgreSQL and answers `session:redirect { path: "/w<id>/socket.io" }`;
#     the client reconnects on that path, which this file pins to one worker.
#     The workers themselves keep Socket.IO's default path — the /w<id>/ prefix
#     exists only here and is stripped by the proxy_pass URI.
#   • REST (/api/*) is stateless (JWT + Postgres) and may hit any worker.
#
# nginx inheritance trap: a location that sets ANY proxy_set_header inherits
# NONE from the server level, so every location below repeats the full set.
#
# A proxied websocket costs nginx TWO connections (client leg + upstream leg),
# so worker_connections in /etc/nginx/nginx.conf must be ≥ 2 × players per
# nginx worker — ops/monitoring/nginx/nginx.conf.example sets 16384.

# ------------------------------------------------------------------ upstream
upstream game_workers {
    least_conn;
    # One entry per game worker: WORKER_BASE_PORT (3100) + WORKER_ID.
    # install-cluster.sh rewrites this list when WORKER_COUNT is not 3.
    # --- workers BEGIN
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3102 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3103 max_fails=3 fail_timeout=10s;
    # --- workers END
    # Reused for REST calls; websockets are never pooled (each one holds its
    # upstream connection for its whole life).
    keepalive 64;
}

# "Connection: upgrade" when the client asked for a websocket, an empty header
# (so upstream keepalive works) otherwise. Named to avoid clashing with a
# $connection_upgrade map another site on this box may already define.
map $http_upgrade $gameplay_connection_upgrade {
    default upgrade;
    ''      '';
}

# -------------------------------------------------------------------- https
server {
    server_name api.sungamestudio.com;

    # The API accepts JSON bodies of at most 32 kB; handshakes are small too.
    client_max_body_size 64k;
    proxy_http_version 1.1;

    # Prometheus scrapes the workers directly on 127.0.0.1:310N/metrics; the
    # endpoint is never reachable from the internet. (Express has no `trust
    # proxy`, so METRICS_ALLOW_IPS could not tell clients apart here anyway.)
    location = /metrics {
        return 404;
    }

    # ----- Grafana (docker, published on 127.0.0.1:3001)
    location /dashboard/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ----- Socket.IO, default path → any worker
    # New players and clients that have not yet learned their worker. Both
    # clients are websocket-first; a client stuck on long-polling would need
    # stickiness here (hash $remote_addr consistent) because polling requests
    # of one session must all reach the same worker.
    location /socket.io/ {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        # An idle seated socket only carries a Socket.IO ping every 25 s; an
        # hour means nginx never closes a healthy game socket on its own.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ----- Socket.IO, per-worker paths → exactly that worker
    # `session:redirect` points a client at /w<id>/socket.io; the trailing
    # /socket.io/ in proxy_pass strips the /w<id> prefix so the worker sees its
    # default path. The list matches the upstream above.
    # --- per-worker paths BEGIN
    location /w1/socket.io/ {
        proxy_pass http://127.0.0.1:3101/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location /w2/socket.io/ {
        proxy_pass http://127.0.0.1:3102/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location /w3/socket.io/ {
        proxy_pass http://127.0.0.1:3103/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    # --- per-worker paths END

    # ----- health: whichever worker answers reports ITS OWN tables/players;
    # for box totals query 127.0.0.1:3101..3103/health or the dashboard.
    location = /health {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        access_log off;
    }

    # ----- REST API and the reference browser client → any worker
    location / {
        proxy_pass http://game_workers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gameplay_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.sungamestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sungamestudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --------------------------------------------------------------- http → https
server {
    if ($host = api.sungamestudio.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name api.sungamestudio.com;
    return 404;
}
