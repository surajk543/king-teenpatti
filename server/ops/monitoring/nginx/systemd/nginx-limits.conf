# /etc/systemd/system/nginx.service.d/limits.conf
#
# systemd caps a service's open files at 1024 soft / 524288 hard by default;
# nginx's worker_rlimit_nofile can raise the soft limit only up to the hard
# one, and Ubuntu's nginx unit does not set LimitNOFILE. Give it headroom for
# worker_connections 16384 × 2 descriptors × several workers.
#
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo cp nginx-limits.conf /etc/systemd/system/nginx.service.d/limits.conf
#   sudo systemctl daemon-reload && sudo systemctl restart nginx
#   cat /proc/$(cat /run/nginx.pid)/limits | grep 'open files'      # expect 65536
[Service]
LimitNOFILE=65536
