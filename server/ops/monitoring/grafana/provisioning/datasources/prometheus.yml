# Grafana datasource provisioning. The dashboard's ${DS_PROMETHEUS} variable
# lists every Prometheus datasource and defaults to this one.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Matches global.scrape_interval in prometheus/prometheus.yml so $__rate_interval
      # is never shorter than two scrapes.
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 2.55.1
      exemplarTraceIdDestinations: []
