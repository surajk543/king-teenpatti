# Grafana dashboard provisioning: every *.json under /var/lib/grafana/dashboards
# (bind-mounted from ../../dashboards) is loaded and kept in sync.
apiVersion: 1

providers:
  - name: king-teenpatti
    orgId: 1
    folder: King Teen Patti
    folderUid: king-teenpatti-dashboards
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Saving from the UI is allowed; the change lives in Grafana's database
    # until this file changes, when the file wins again. To keep a UI edit,
    # export the dashboard JSON and replace king-teenpatti.json with it.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
